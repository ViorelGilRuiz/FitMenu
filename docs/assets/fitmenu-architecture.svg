    <text x="500" y="176" fill="#7CD3FF" font-size="20" font-family="Segoe UI, Arial, sans-serif">BACKEND</text>
    <text x="500" y="222" fill="#EAF3FF" font-size="34" font-weight="700" font-family="Segoe UI, Arial, sans-serif">FastAPI Engine</text>
