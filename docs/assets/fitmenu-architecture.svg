    <text x="110" y="176" fill="#7CD3FF" font-size="20" font-family="Segoe UI, Arial, sans-serif">FRONTEND</text>
    <text x="110" y="222" fill="#EAF3FF" font-size="34" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Vanilla JS App</text>
    <text x="110" y="266" fill="#AEC4E2" font-size="22" font-family="Segoe UI, Arial, sans-serif">login • form • cards 3D • recipe</text>
    <text x="110" y="305" fill="#AEC4E2" font-size="22" font-family="Segoe UI, Arial, sans-serif">shared styles + animated background</text>
  </g>

  <g>
