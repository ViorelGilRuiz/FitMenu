    <text x="890" y="222" fill="#EAF3FF" font-size="34" font-weight="700" font-family="Segoe UI, Arial, sans-serif">PostgreSQL Ready</text>
    <text x="890" y="266" fill="#AEC4E2" font-size="22" font-family="Segoe UI, Arial, sans-serif">users • profiles • recipes</text>
    <text x="890" y="305" fill="#AEC4E2" font-size="22" font-family="Segoe UI, Arial, sans-serif">weekly menus + history</text>
  </g>

  <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <path d="M430 274H458"/>
    <path d="M820 274H848"/>
