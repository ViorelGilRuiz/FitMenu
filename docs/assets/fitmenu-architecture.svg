  </defs>

  <rect width="1280" height="520" rx="18" fill="url(#bg)" stroke="#2A5188"/>
  <text x="60" y="64" fill="#EAF3FF" font-size="34" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Technical Architecture</text>

  <g>
