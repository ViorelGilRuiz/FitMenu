<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitMenu AI | Login</title>
  <link rel="stylesheet" href="shared.css?v=5" />
</head>
<body class="login-mode" data-scene="login">
  <canvas id="universe-bg"></canvas>
  <div class="login-glow"></div>
  <div class="login-grid"></div>
  <main class="page center-page">
    <section class="glass login-card">
      <p class="eyebrow">Nutricion Inteligente</p>
      <h1>FitMenu AI</h1>
      <p class="subtitle">Accede para crear menus personalizados con IA</p>
      <form id="loginForm" class="stack">
        <label>Email<input id="email" type="email" required placeholder="tu@email.com" /></label>
        <label>Contrasena<input id="password" type="password" required minlength="8" placeholder="Minimo 8 caracteres" /></label>
        <button class="primary" id="authSubmitBtn" type="submit">Entrar</button>
        <button class="ghost" id="registerBtn" type="button">Crear cuenta</button>
        <a class="auth-link" href="#" aria-disabled="true">¿Olvidaste la contraseña?</a>
      </form>
      <p id="authStatus" class="muted"></p>
    </section>
  </main>
  <script type="module" src="background.js?v=8"></script>
  <script type="module" src="js/pages/loginPage.js?v=1"></script>
</body>
</html>
