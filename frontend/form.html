<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitMenu AI | Formulario</title>
  <link rel="stylesheet" href="shared.css?v=6" />
</head>
<body class="kitchen-app" data-scene="app">
  <canvas id="universe-bg"></canvas>
  <div class="page app-page">
    <div id="topbarMount"></div>

    <main class="form-shell">
      <section class="glass panel panel-profile form-only">
        <h2>Perfil y preferencias</h2>
        <div id="accountSnapshot" class="account-snapshot"></div>
        <form id="profileForm" class="stack scroll-area">
          <div class="field-grid">
            <label>Sexo
              <select id="sex">
                <option value="female">Mujer</option>
                <option value="male">Hombre</option>
              </select>
            </label>
            <label>Edad<input id="age" type="number" min="14" max="90" value="28" required /></label>
            <label>Peso (kg)<input id="weight" type="number" min="30" max="300" step="0.1" value="75" required /></label>
            <label>Altura (cm)<input id="height" type="number" min="120" max="230" value="178" required /></label>
            <label>Comidas al dia<input id="mealsPerDay" type="number" min="3" max="6" value="4" required /></label>
          </div>

          <label>Objetivo
            <select id="goal">
              <option value="lose_fat">Perder grasa</option>
              <option value="maintain">Mantener</option>
              <option value="gain_muscle" selected>Ganar musculo</option>
            </select>
          </label>

          <label>Dieta
            <select id="diet">
              <option value="omnivore" selected>Omnivoro</option>
              <option value="vegetarian">Vegetariano</option>
              <option value="vegan">Vegano</option>
            </select>
          </label>

          <div class="toggle-row">
            <label class="row"><input id="lactoseFree" type="checkbox" /> Sin lactosa</label>
            <label class="row"><input id="glutenFree" type="checkbox" /> Sin gluten</label>
          </div>

          <label>Alergias (coma separada)<input id="allergies" placeholder="peanut, shellfish" /></label>
          <label>Ingredientes que no te gustan (coma separada)<input id="dislikes" placeholder="cebolla, cilantro, tofu" /></label>

          <button id="saveProfileBtn" class="primary sticky" type="submit">Guardar y generar menu</button>
        </form>
        <p id="formStatus" class="muted"></p>
      </section>
    </main>
  </div>

  <script type="module" src="background.js?v=8"></script>
  <script type="module" src="js/pages/formPage.js?v=1"></script>
</body>
</html>
